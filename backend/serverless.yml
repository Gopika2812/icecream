service: icecream-erp-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  httpApi:
    cors:
      allowedOrigins:
        - 'https://saravanas-5c3bc.web.app'
        - 'http://localhost:5173'
        - 'http://localhost:3000'
      allowedHeaders:
        - 'Authorization'
        - 'Content-Type'
        - 'X-Requested-With'
        - 'Accept'
        - 'Origin'
      allowedMethods:
        - 'GET'
        - 'POST'
        - 'PUT'
        - 'PATCH'
        - 'DELETE'
        - 'OPTIONS'
        - 'HEAD'
      allowCredentials: true
  environment:
    NODE_ENV: production
    JWT_SECRET: ${env:JWT_SECRET, 'super_secret_jwt_key_for_erp_2026'}
    USERS_TABLE: ${self:service}-users-${self:provider.stage}
    ROLES_TABLE: ${self:service}-roles-${self:provider.stage}
    BRANCHES_TABLE: ${self:service}-branches-${self:provider.stage}
    CATEGORIES_TABLE: ${self:service}-categories-${self:provider.stage}
    ITEM_TYPES_TABLE: ${self:service}-item-types-${self:provider.stage}
    PRODUCTS_TABLE: ${self:service}-products-${self:provider.stage}
    CUSTOMERS_TABLE: ${self:service}-customers-${self:provider.stage}
    VENDORS_TABLE: ${self:service}-vendors-${self:provider.stage}
    INVENTORY_TABLE: ${self:service}-inventory-${self:provider.stage}
    INVENTORY_TRANSACTIONS_TABLE: ${self:service}-inventory-transactions-${self:provider.stage}
    SALES_ORDERS_TABLE: ${self:service}-sales-orders-${self:provider.stage}
    PURCHASE_ORDERS_TABLE: ${self:service}-purchase-orders-${self:provider.stage}
    GRN_TABLE: ${self:service}-grn-${self:provider.stage}
    QUALITY_CONTROL_TABLE: ${self:service}-quality-control-${self:provider.stage}
    PRODUCTION_TABLE: ${self:service}-production-${self:provider.stage}
    AUTO_SALES_ENTRIES_TABLE: ${self:service}-auto-sales-entries-${self:provider.stage}
    CUSTOMER_RECEIPTS_TABLE: ${self:service}-customer-receipts-${self:provider.stage}
    VENDOR_PAYMENTS_TABLE: ${self:service}-vendor-payments-${self:provider.stage}
    COUNTERS_TABLE: ${self:service}-counters-${self:provider.stage}
    PRODUCT_REQUISITION_TABLE: ${self:service}-product-requisition-${self:provider.stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
          Resource: "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-*"

functions:
  api:
    handler: handler.handler
    events:
      - httpApi:
          path: '/{proxy+}'
          method: '*'
      - httpApi:
          path: '/'
          method: '*'

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    RolesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.ROLES_TABLE}
